<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shakil's Shop</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Header */
        header {
            background-color: #14213d;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            font-size: 45px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 20px;
        }

        /* Navigation */
        nav {
            background-color: #1f2937;
            text-align: center;
            padding: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 18px;
        }

        nav a:hover {
            color: #ff9800;
        }

        /* Title */
        .title {
            text-align: center;
            margin-top: 40px;
            font-size: 38px;
        }

        /* Products */
        .products {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            padding: 40px 20px;
        }

        .product {
            background-color: white;
            width: 250px;
            padding: 20px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 4px 15px #cccccc;
            transition: 0.3s;
        }

        .product:hover {
            transform: translateY(-5px);
        }

        .product-image {
            height: 180px;
            background-color: #eef2f7;
            border-radius: 12px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 90px;
        }

        .product h2 {
            font-size: 23px;
            margin-bottom: 10px;
        }

        .description {
            color: #555;
        }

        .price {
            color: #16803c;
            font-size: 24px;
            font-weight: bold;
        }

        button {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #e68900;
        }

        /* Contact/Footer */
        footer {
            margin-top: 40px;
            background-color: #14213d;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        footer h2 {
            font-size: 28px;
        }

        /* Mobile */
        @media (max-width: 600px) {

            header h1 {
                font-size: 35px;
            }

            nav a {
                display: inline-block;
                margin: 8px;
            }

            .product {
                width: 90%;
            }
        }

    </style>
</head>


<body>

    <!-- Header -->
    <header id="home">
        <h1>🛒 Shakil's Shop</h1>
        <p>Your Trusted Electronics Shop</p>
    </header>


    <!-- Navigation -->
    <nav>
        #homeHome</a>
        #productsProducts</a>
        #contactContact</a>
        #products🛒 Shop</a>
    </nav>


    <!-- Products -->

        </div>

            </p>

            <p class="price">
                €49.99
            </p>

            <button onclick="addToCart('Electric Fan')">
                Add to Cart
            </button>

        </div>


        <!-- AC -->

            <div class="product-image">
                ❄️

            <h2>Air Conditioner</h2>

            </p>

            <button onclick="addToCart('Air Conditioner')">
                Add to Cart
            </button>

        </div>
